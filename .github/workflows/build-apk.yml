name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      
    - name: ☕ 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: 🔧 授予Gradle执行权限
      run: chmod +x gradlew || true
      
    - name: 🏗️  编译Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace || true
        echo "编译完成,查找APK文件..."
        find app/build/outputs/apk -name "*.apk" -type f || true
        
    - name: 🚀 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Battle-Platform-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
        
    - name: ✅ 编译完成通知
      run: |
        echo "==================================="
        echo "🎉 APK编译完成!"
        echo "📱 下载地址: Actions → Artifacts"
        echo "==================================="
